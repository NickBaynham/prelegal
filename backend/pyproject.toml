[project]
name = "prelegal-backend"
version = "0.1.0"
description = "PreLegal backend: FastAPI service with SQLite persistence."
authors = [{ name = "Nick Baynham", email = "nickbaynham@gmail.com" }]
requires-python = ">=3.13,<4.0"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.13.0",
]

[tool.pdm]
distribution = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
